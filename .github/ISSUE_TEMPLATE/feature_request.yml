name: Feature Request
description: Suggest a new feature or improvement for sein
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm looking for a better way to handle..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've explored.
  - type: textarea
    id: core_justification
    attributes:
      label: Why should this be part of sein core?
      description: |
        sein is a zero-allocation single-port server reactor.
        Explain why this feature benefits a broad range of server workloads and fits the
        0 B/op and carrier-grade resilience mission of the project.
      placeholder: "This would benefit all server workloads because..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of sein does this affect?
      options:
        - Single-Port Demux (ALPN / CID routing)
        - HTTP/1.1 Pipeline
        - HTTP/2 Multiplexer & HPACK
        - HTTP/3 & QUIC / QPACK Engine
        - WebSockets (RFC 8441 / RFC 9220)
        - gRPC & gRPC-Web Framing
        - Anti-DoS Armor & Rate Limiting
        - Memory Safety (borrow.Scope / Zero-Alloc)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, code snippets, or references here.
