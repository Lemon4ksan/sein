name: Bug Report
description: Create a report to help us improve sein
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please search existing issues before submitting to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: I encountered an issue when handling concurrent HTTP/2 streams...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Provide the smallest possible Go snippet or test case that reproduces the issue.
        Wrap code in triple backticks for formatting.
      placeholder: |
        ```go
        srv := sein.NewServer(option.WithAddr(":443"))
        // ...
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error logs, pprof traces, or stack traces.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: go_version
    attributes:
      label: Go Version
      description: Run `go version` and paste the output.
      placeholder: "e.g., go version go1.25.4 linux/amd64"
    validations:
      required: true
  - type: input
    id: sein_version
    attributes:
      label: sein version
      description: Run `go list -m github.com/lemon4ksan/sein` and paste the output.
      placeholder: "e.g., github.com/lemon4ksan/sein v0.1.0"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here (protocol multiplexer config, TLS setup, etc.).
