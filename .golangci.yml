version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - gosec
    - noctx
  settings:
    gocritic:
      disabled-checks:
        - captLocal
        - assignOp
        - elseif
        - ifElseChain
        - appendAssign
        - singleCaseSwitch
    gosec:
      excludes:
        - G104
        - G115
        - G103
    staticcheck:
      checks: ["all", "-SA5008"]
  exclusions:
    paths:
      - internal/compress/brotli
      - internal/compress/zstd
      - internal/compress/huff0
      - internal/compress/fse
      - internal/compress/flate
    rules:
      - linters: [staticcheck]
        text: "SA5008:"
      - linters: [govet]
        text: "structtag:"
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx
          - gocritic

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

